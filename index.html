<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Rotating Shield | Security System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Monaco', monospace;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            max-width: 1200px;
            width: 100%;
        }

        .plate-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            perspective: 1000px;
        }

        /* Red Background Plate - STATIC (teri red-bg.png image use karega) */
        .plate {
            background: url('red-bg.png') no-repeat center center;
            background-size: cover;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            cursor: grab;
            border: 3px solid #ff3333;
            position: relative;
        }

        .plate:active {
            cursor: grabbing;
        }

        /* 3D Shield Container - Coin style rotation */
        .shield-3d {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.03s linear;
        }

        /* Shield Front Side (teri shield-only.png image) */
        .shield-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shield-front img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px #ff6666);
        }

        /* Shield Back Side */
        .shield-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            background: radial-gradient(circle, #2a2a2a, #1a1a1a);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ff6666;
            box-shadow: inset 0 0 20px rgba(255,0,0,0.3);
        }

        .shield-back span {
            color: #ff6666;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            font-family: monospace;
        }

        /* Status Panel */
        .status-panel {
            background: rgba(0, 0, 0, 0.85);
            border-left: 5px solid #ff4444;
            padding: 25px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            min-width: 280px;
            font-weight: bold;
        }

        .status-panel h1 {
            color: #ff4444;
            font-size: 1.5rem;
            letter-spacing: 2px;
            border-bottom: 2px solid #ff4444;
            display: inline-block;
            margin-bottom: 20px;
        }

        .status-line {
            margin: 15px 0;
            font-size: 1.1rem;
        }

        .status-label {
            color: #aaa;
            letter-spacing: 1px;
        }

        .status-value {
            color: #0f0;
            font-weight: bold;
            margin-left: 10px;
        }

        .threat-high {
            color: #ff4444;
            text-shadow: 0 0 5px red;
            animation: blink 1s infinite;
        }

        .energy-bar {
            background: #333;
            height: 12px;
            width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
        }

        .energy-fill {
            width: 98%;
            height: 100%;
            background: linear-gradient(90deg, #0f0, #afa);
            border-radius: 10px;
        }

        .id-box {
            background: #111;
            padding: 8px;
            border-radius: 8px;
            font-family: monospace;
            margin-top: 15px;
            text-align: center;
            color: #ff8888;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info-footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #ff8888;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 8px;
        }

        @media (max-width: 700px) {
            .plate { width: 260px; height: 260px; }
            .shield-3d { width: 150px; height: 150px; }
            .status-panel { padding: 15px 20px; min-width: 240px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="plate-section">
        <div class="plate" id="plate">
            <div class="shield-3d" id="shield3d">
                <div class="shield-front">
                    <img src="shield-only.png" alt="Shield Front">
                </div>
                <div class="shield-back">
                    <span>🛡️<br>SECURE</span>
                </div>
            </div>
        </div>
    </div>

    <div class="status-panel">
        <h1>⚠ SECURITY ALERT ⚠</h1>
        <div class="status-line">
            <span class="status-label">SHIELD STATUS:</span>
            <span class="status-value">🟢 SYSTEM PROTECTION ACTIVE</span>
        </div>
        <div class="status-line">
            <span class="status-label">ENERGY LEVEL:</span>
            <span class="status-value">98%</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill"></div>
        </div>
        <div class="status-line">
            <span class="status-label">THREAT LEVEL:</span>
            <span class="status-value threat-high">⚠ HIGH ⚠</span>
        </div>
        <div class="id-box">
            📛 ID: A7X-23 &nbsp;&nbsp;|&nbsp;&nbsp; ⚙ SYS-04
        </div>
        <div class="info-footer">
            🪙 3D Coin-Style Rotation | Drag left/right to rotate | Release = Auto
        </div>
    </div>
</div>

<script>
    const shield3d = document.getElementById('shield3d');
    const plate = document.getElementById('plate');

    let autoRotate = true;
    let autoAngle = 0;
    let dragStartX = 0;
    let currentManualAngle = 0;
    let isDragging = false;
    let animationId = null;

    function startAutoRotate() {
        if (animationId) cancelAnimationFrame(animationId);
        
        function rotateLoop() {
            if (!autoRotate) return;
            autoAngle += 1.2;
            if (autoAngle >= 360) autoAngle -= 360;
            shield3d.style.transform = `rotateY(${autoAngle}deg)`;
            animationId = requestAnimationFrame(rotateLoop);
        }
        
        rotateLoop();
    }

    function getCurrentRotation() {
        const transform = shield3d.style.transform;
        if (!transform || transform === 'none') return 0;
        const match = transform.match(/rotateY\(([-\d.]+)deg\)/);
        if (match && match[1]) return parseFloat(match[1]);
        return 0;
    }

    function startDrag(event) {
        event.preventDefault();
        isDragging = true;
        autoRotate = false;
        
        if (animationId) cancelAnimationFrame(animationId);
        
        let clientX;
        if (event.touches) {
            clientX = event.touches[0].clientX;
        } else {
            clientX = event.clientX;
        }
        
        dragStartX = clientX;
        currentManualAngle = getCurrentRotation();
    }

    function onDrag(event) {
        if (!isDragging) return;
        event.preventDefault();
        
        let clientX;
        if (event.touches) {
            clientX = event.touches[0].clientX;
        } else {
            clientX = event.clientX;
        }
        
        let deltaX = clientX - dragStartX;
        let newAngle = currentManualAngle + deltaX * 0.8;
        newAngle = newAngle % 360;
        shield3d.style.transform = `rotateY(${newAngle}deg)`;
    }

    function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        
        const finalAngle = getCurrentRotation();
        currentManualAngle = finalAngle;
        autoRotate = true;
        autoAngle = finalAngle;
        startAutoRotate();
    }

    plate.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', stopDrag);
    plate.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', onDrag, { passive: false });
    window.addEventListener('touchend', stopDrag);

    shield3d.style.transform = `rotateY(0deg)`;
    startAutoRotate();
</script>
</body>
</html>
